services:
  backend:
    restart: "unless-stopped"
    build: .
    image: backend
    ports:
      - "8000:8000"
    volumes:
      - ./:/app/
    depends_on:
      - db
    environment:
      - DB_HOST=db
    command: ["python3", "manage.py", "runserver", "0.0.0.0:8000"]

  db:
    image: docker.io/postgres:alpine
    restart: "unless-stopped"
    ports:
      - 5432:5432/tcp
    environment:
      - POSTGRES_USER=test
      - POSTGRES_PASSWORD=test
      - POSTGRES_DB=test
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    volumes:
      - ./.schemas:/var/lib/postgresql/data


  redis:
    image: redis:alpine
    restart: "unless-stopped"
    ports:
      - 6379:6379
    volumes:
      - ./redis-data:/data

  celery:
    restart: "unless-stopped"
    build: .
    image: backend
    volumes:
      - ./:/app/
    environment:
      - REDIS_HOST=redis
      - DB_HOST=db
    command: celery -A core worker -l info